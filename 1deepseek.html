<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — бесплатный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2129; --bg4:#21262d;
  --border:#30363d; --text:#e6edf3; --muted:#8b949e;
  --accent:#2ea043; --accent2:#3fb950; --yellow:#d29922;
  --blue:#58a6ff; --red:#f85149; --purple:#bc8cff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.6; overflow:hidden;
}
code,pre,.mono{font-family:"JetBrains Mono","Fira Code",Consolas,"Courier New",monospace}

/* ===== HEADER ===== */
header{
  height:56px; background:var(--bg2); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:16px; padding:0 16px;
  position:fixed; top:0; left:0; right:0; z-index:100;
}
.burger{
  display:none; background:none; border:1px solid var(--border); color:var(--text);
  border-radius:6px; width:36px; height:34px; cursor:pointer; font-size:16px;
}
.logo{font-weight:800; font-size:19px; letter-spacing:-.5px; white-space:nowrap}
.logo span{color:var(--accent2)}
.progress-wrap{
  flex:1; height:10px; background:var(--bg4); border-radius:6px; overflow:hidden;
  max-width:520px; margin:0 auto;
}
.progress-bar{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .4s ease; border-radius:6px}
.progress-text{color:var(--muted); font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums}
.reset-btn{
  background:none; border:1px solid var(--border); color:var(--muted);
  border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer;
}
.reset-btn:hover{color:var(--red); border-color:var(--red)}

/* ===== LAYOUT ===== */
main{display:flex; height:100vh; padding-top:56px}
aside{
  width:310px; min-width:310px; background:var(--bg2); border-right:1px solid var(--border);
  overflow-y:auto; padding:14px 0 60px;
}
aside::-webkit-scrollbar,.content::-webkit-scrollbar,.editor-wrap textarea::-webkit-scrollbar{width:10px;height:10px}
aside::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb{background:#30363d;border-radius:6px}
.content{flex:1; overflow-y:auto; padding:22px 26px 80px; scroll-behavior:smooth}
.inner{max-width:900px; margin:0 auto}

/* ===== NAV ===== */
.nav-module{margin-bottom:6px}
.nav-module-title{
  padding:12px 18px 6px; font-size:11px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted);
}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:8px 18px; cursor:pointer;
  font-size:13.5px; color:#c9d1d9; border-left:3px solid transparent; transition:background .12s;
}
.nav-item:hover{background:var(--bg3)}
.nav-item.active{background:var(--bg3); border-left-color:var(--accent2); color:#fff; font-weight:600}
.nav-item .check{
  width:17px; height:17px; min-width:17px; border-radius:50%; border:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:10px; color:transparent;
}
.nav-item.done .check{background:var(--accent); border-color:var(--accent); color:#fff}

/* ===== CARDS ===== */
.card{
  background:var(--bg2); border:1px solid var(--border); border-radius:10px;
  padding:20px 22px; margin-bottom:18px;
}
.card h2{font-size:22px; margin-bottom:6px; letter-spacing:-.3px}
.card h3{font-size:15px; margin-bottom:10px; color:var(--accent2); text-transform:uppercase; letter-spacing:.06em}
.lesson-meta{color:var(--muted); font-size:13px; margin-bottom:16px}
.theory p{margin:10px 0; color:#c9d1d9}
.theory ul,.theory ol{margin:10px 0 10px 22px; color:#c9d1d9}
.theory li{margin:4px 0}
.theory code{
  background:var(--bg4); padding:2px 6px; border-radius:4px; font-size:13px; color:#ffa657;
}
.theory pre{
  background:#0d1117; border:1px solid var(--border); border-radius:8px;
  padding:13px 15px; margin:12px 0; overflow-x:auto; font-size:13.5px; line-height:1.6;
}
.theory pre code{background:none; padding:0; color:#e6edf3}
.theory strong{color:#fff}
.theory .tip{
  border-left:3px solid var(--yellow); background:rgba(210,153,34,.08);
  padding:10px 14px; border-radius:0 6px 6px 0; margin:12px 0; font-size:14px; color:#e3b341;
}
.task-box{background:var(--bg3); border-radius:8px; padding:14px 16px; font-size:14.5px; color:#c9d1d9}
.task-box code{background:var(--bg4); padding:2px 6px; border-radius:4px; color:#ffa657; font-size:13px}

/* ===== EDITOR ===== */
.editor-card{padding:0; overflow:hidden}
.editor-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 14px; background:var(--bg3); border-bottom:1px solid var(--border);
  font-size:13px; color:var(--muted);
}
.dots{display:flex; gap:6px; margin-right:10px}
.dot{width:11px;height:11px;border-radius:50%}
.editor-actions{display:flex; gap:8px; flex-wrap:wrap}
.btn{
  border:1px solid var(--border); background:var(--bg4); color:var(--text);
  padding:6px 13px; border-radius:6px; cursor:pointer; font-size:13px;
  font-family:inherit; transition:.15s; white-space:nowrap;
}
.btn:hover{background:#30363d}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--bg4)}

.editor-wrap{position:relative; height:340px; background:#0d1117}
.editor-wrap pre,.editor-wrap textarea{
  position:absolute; inset:0; margin:0; padding:14px 16px;
  font-family:"JetBrains Mono","Fira Code",Consolas,monospace;
  font-size:13.5px; line-height:1.62; white-space:pre;
  overflow:auto; tab-size:4; border:0; outline:none;
}
.editor-wrap pre{pointer-events:none; z-index:0; color:#e6edf3}
.editor-wrap textarea{
  z-index:1; background:transparent; color:transparent; caret-color:var(--blue);
  resize:none; width:100%; height:100%;
}
.editor-wrap textarea::selection{background:rgba(88,166,255,.35)}
.t-kw{color:#ff7b72} .t-str{color:#a5d6ff} .t-com{color:#8b949e;font-style:italic}
.t-num{color:#79c0ff} .t-bi{color:#d2a8ff}

/* ===== OUTPUT ===== */
.output-card{padding:0; overflow:hidden}
.output-head{
  padding:9px 14px; background:var(--bg3); border-bottom:1px solid var(--border);
  font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:700;
}
#output{
  padding:14px 16px; font-size:13.5px; white-space:pre-wrap; word-break:break-word;
  min-height:60px; max-height:320px; overflow:auto; color:#c9d1d9; background:#0d1117;
}
#output .err{color:var(--red)}
.result{
  padding:12px 16px; font-size:14px; border-top:1px solid var(--border);
  display:flex; align-items:flex-start; gap:10px;
}
.result.pass{background:rgba(46,160,67,.12); color:var(--accent2)}
.result.fail{background:rgba(248,81,73,.1); color:#ff9b95}
.result.hide{display:none}
.result .icon{font-size:16px; line-height:1.4}
.result pre{white-space:pre-wrap; font-size:12.5px; margin-top:6px; color:#c9d1d9; opacity:.85}

/* ===== BOTTOM NAV ===== */
.nav-buttons{display:flex; justify-content:space-between; gap:12px; margin-top:6px}
.nav-buttons .btn{padding:10px 20px; font-size:14px}

/* ===== LOADER ===== */
#loader{
  position:fixed; inset:0; background:rgba(13,17,23,.88); z-index:500;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  backdrop-filter:blur(3px);
}
#loader.hide{display:none}
.spinner{
  width:46px; height:46px; border:4px solid var(--border); border-top-color:var(--accent2);
  border-radius:50%; animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loaderText{color:var(--muted); font-size:14px; text-align:center; max-width:340px}

/* ===== MOBILE ===== */
@media (max-width:900px){
  .burger{display:block}
  aside{
    position:fixed; top:56px; bottom:0; left:0; z-index:90;
    transform:translateX(-100%); transition:transform .25s ease; width:290px; min-width:290px;
  }
  aside.open{transform:translateX(0); box-shadow:6px 0 24px rgba(0,0,0,.6)}
  .content{padding:16px 14px 80px}
  .progress-wrap{max-width:none}
  .progress-text{display:none}
  .reset-btn{display:none}
  .editor-wrap{height:280px}
}
</style>
</head>
<body>

<header>
  <button class="burger" id="burger">☰</button>
  <div class="logo">Py<span>Camp</span></div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="progress-text" id="progressText">0 / 0</div>
  <button class="reset-btn" id="resetBtn">Сбросить прогресс</button>
</header>

<main>
  <aside id="sidebar"><nav id="nav"></nav></aside>

  <section class="content">
    <div class="inner">

      <div class="card">
        <h2 id="lessonTitle"></h2>
        <div class="lesson-meta" id="lessonMeta"></div>
        <div class="theory" id="theory"></div>
      </div>

      <div class="card">
        <h3>Задание</h3>
        <div class="task-box" id="task"></div>
      </div>

      <div class="card editor-card">
        <div class="editor-header">
          <div style="display:flex;align-items:center">
            <div class="dots">
              <div class="dot" style="background:#ff5f56"></div>
              <div class="dot" style="background:#ffbd2e"></div>
              <div class="dot" style="background:#27c93f"></div>
            </div>
            main.py
          </div>
          <div class="editor-actions">
            <button class="btn ghost" id="resetCodeBtn" title="Вернуть исходный код">↺ Сброс</button>
            <button class="btn" id="runBtn">▶ Запустить</button>
            <button class="btn primary" id="checkBtn">✓ Проверить</button>
          </div>
        </div>
        <div class="editor-wrap">
          <pre id="highlight" aria-hidden="true"><code id="hlCode"></code></pre>
          <textarea id="code" spellcheck="false" wrap="off" autocapitalize="off" autocorrect="off"></textarea>
        </div>
      </div>

      <div class="card output-card">
        <div class="output-head">Вывод программы</div>
        <pre id="output">Нажмите «Запустить», чтобы выполнить код.</pre>
        <div class="result hide" id="result"></div>
      </div>

      <div class="card" style="padding:14px 18px">
        <div style="font-size:13px;color:var(--muted);margin-bottom:10px">
          💡 Совет: <b>Ctrl + Enter</b> — запустить код. Решение доступно, но сначала попробуйте сами!
        </div>
        <button class="btn ghost" id="solutionBtn" style="width:100%">👁 Показать решение</button>
      </div>

      <div class="nav-buttons">
        <button class="btn" id="prevBtn">← Назад</button>
        <button class="btn" id="nextBtn">Далее →</button>
      </div>

    </div>
  </section>
</main>

<div id="loader" class="hide">
  <div class="spinner"></div>
  <div id="loaderText">Загрузка Python…</div>
</div>

<script>
/* ============================================================
   КУРРИКУЛУМ
   ============================================================ */
const COURSE = [
{
  title: "Основы Python",
  lessons: [
  {
    id: "l01", title: "Привет, Python!",
    theory: String.raw`
<p><strong>Python</strong> — один из самых популярных языков программирования в мире. Его код читается почти как обычный текст, поэтому он идеально подходит для первых шагов.</p>
<p>Первая программа на любом языке — вывод приветствия. Для вывода текста на экран используется функция <code>print()</code>:</p>
<pre><code>print("Привет, мир!")</code></pre>
<p>Текст в кавычках называется <strong>строкой</strong>. Кавычки могут быть одинарными или двойными — разницы нет:</p>
<pre><code>print('Привет')
print("Привет")</code></pre>
<p><code>print()</code> умеет принимать несколько значений через запятую — они выведутся через пробел:</p>
<pre><code>print("Мне", 25, "лет")   # Мне 25 лет</code></pre>
<p>Строки, начинающиеся с символа <code>#</code>, — это <strong>комментарии</strong>. Python их полностью игнорирует, а программисты используют для пояснений:</p>
<pre><code># Это комментарий
print("Код")   # а это — комментарий после кода</code></pre>
<div class="tip">Каждый вызов <code>print()</code> автоматически добавляет перевод строки в конце.</div>
`,
    task: `Выведите на экран две строки:<br>
      1. <code>Привет, мир!</code><br>
      2. <code>Я изучаю Python</code>`,
    starter: String.raw`# Напишите ваш код ниже
`,
    solution: String.raw`print("Привет, мир!")
print("Я изучаю Python")`,
    tests: String.raw`
_lines = [l.strip() for l in OUT.strip().split("\n") if l.strip()]
assert len(_lines) >= 2, "Нужно вывести две строки, а получено: " + str(len(_lines))
assert _lines[0] == "Привет, мир!", "Первая строка должна быть ровно: Привет, мир!"
assert _lines[1] == "Я изучаю Python", "Вторая строка должна быть ровно: Я изучаю Python"
`
  },
  {
    id: "l02", title: "Переменные и типы данных",
    theory: String.raw`
<p><strong>Переменная</strong> — это имя, за которым хранится значение. Создаётся она простым присваиванием:</p>
<pre><code>name = "Ада"
age = 36
height = 1.65
is_programmer = True</code></pre>
<p>Python — язык с <strong>динамической типизацией</strong>: не нужно заранее объявлять тип переменной, он определяется по значению.</p>
<p>Основные типы:</p>
<ul>
  <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
  <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
  <li><code>str</code> — строки: <code>"Привет"</code></li>
  <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
  <li><code>NoneType</code> — «ничего», единственное значение <code>None</code></li>
</ul>
<p>Узнать тип можно функцией <code>type()</code>:</p>
<pre><code>print(type(42))       # &lt;class 'int'&gt;
print(type("текст"))  # &lt;class 'str'&gt;</code></pre>
<p>Правила именования: буквы, цифры и <code>_</code>, при этом имя не может начинаться с цифры. Регистр важен: <code>Age</code> и <code>age</code> — разные переменные.</p>
<pre><code>x = 10
x = x + 5      # теперь x равно 15
x += 5         # краткая запись: x = x + 5
a, b = 1, 2    # множественное присваивание</code></pre>
`,
    task: `Создайте четыре переменные:<br>
      • <code>name</code> со значением <code>"Ада"</code><br>
      • <code>age</code> со значением <code>36</code><br>
      • <code>height</code> со значением <code>1.65</code><br>
      • <code>is_programmer</code> со значением <code>True</code>`,
    starter: String.raw`# Создайте переменные ниже
`,
    solution: String.raw`name = "Ада"
age = 36
height = 1.65
is_programmer = True`,
    tests: String.raw`
for _v in ["name", "age", "height", "is_programmer"]:
    assert _v in globals(), f"Переменная {_v} не найдена"
assert name == "Ада", "name должно быть равно 'Ада'"
assert age == 36, "age должно быть равно 36"
assert height == 1.65, "height должно быть равно 1.65"
assert is_programmer is True, "is_programmer должно быть True"
`
  },
  {
    id: "l03", title: "Числа и арифметика",
    theory: String.raw`
<p>Python умеет работать с числами как обычный калькулятор:</p>
<pre><code>print(7 + 3)    # 10
print(7 - 3)    # 4
print(7 * 3)    # 21
print(7 / 3)    # 2.3333333333333335  (обычное деление всегда даёт float)
print(7 // 3)   # 2   целочисленное деление (отбрасывает дробную часть)
print(7 % 3)    # 1   остаток от деления
print(7 ** 3)   # 343 возведение в степень</code></pre>
<p>Оператор <code>%</code> (остаток) очень полезен: с его помощью проверяют чётность числа — <code>n % 2 == 0</code>.</p>
<p>Приоритет операций такой же, как в математике; круглые скобки его меняют:</p>
<pre><code>print(2 + 3 * 4)     # 14
print((2 + 3) * 4)   # 20</code></pre>
<p>Полезные встроенные функции:</p>
<pre><code>print(abs(-5))        # 5    модуль числа
print(round(3.14159, 2))  # 3.14 округление
print(min(4, 9, 2))   # 2
print(max(4, 9, 2))   # 9</code></pre>
`,
    task: `Даны переменные <code>a = 17</code> и <code>b = 5</code>. Вычислите и сохраните в переменные:<br>
      • <code>total</code> — сумма<br>
      • <code>diff</code> — разность (a − b)<br>
      • <code>product</code> — произведение<br>
      • <code>quotient</code> — обычное деление<br>
      • <code>int_div</code> — целочисленное деление<br>
      • <code>remainder</code> — остаток<br>
      • <code>power</code> — a в степени b`,
    starter: String.raw`a = 17
b = 5

# Вычислите значения ниже
`,
    solution: String.raw`a = 17
b = 5

total = a + b
diff = a - b
product = a * b
quotient = a / b
int_div = a // b
remainder = a % b
power = a ** b`,
    tests: String.raw`
for _v in ["total","diff","product","quotient","int_div","remainder","power"]:
    assert _v in globals(), f"Переменная {_v} не найдена"
assert total == 22, "total должно быть 22"
assert diff == 12, "diff должно быть 12"
assert product == 85, "product должно быть 85"
assert abs(quotient - 3.4) < 1e-9, "quotient должно быть 3.4"
assert int_div == 3, "int_div должно быть 3"
assert remainder == 2, "remainder должно быть 2"
assert power == 17 ** 5, "power должно быть 17 в степени 5"
`
  },
  {
    id: "l04", title: "Строки и их методы",
    theory: String.raw`
<p>Строка — это последовательность символов. У строк есть множество полезных методов:</p>
<pre><code>s = "  Python это круто  "

print(s.strip())        # "Python это круто" — убирает пробелы по краям
print(s.upper())        # ВСЁ В ВЕРХНЕМ РЕГИСТРЕ
print(s.lower())        # всё в нижнем регистре
print(len(s))           # 21 — длина строки
print(s.replace("круто", "супер"))   # заменяет подстроку
print(s.split())        # ['Python', 'это', 'круто'] — разбивает по пробелам
print("a,b,c".split(","))  # ['a', 'b', 'c']
print("-".join(["a","b","c"]))  # "a-b-c"</code></pre>
<p>Строки можно складывать (конкатенация) и умножать:</p>
<pre><code>print("Py" + "thon")   # Python
print("ab" * 3)        # ababab</code></pre>
<p>Обратиться к отдельному символу можно по индексу (нумерация с нуля):</p>
<pre><code>word = "Python"
print(word[0])    # P
print(word[-1])   # n  (последний символ)</code></pre>
<div class="tip">Строки в Python <strong>неизменяемы</strong>: <code>s.upper()</code> не меняет <code>s</code>, а возвращает новую строку. Результат нужно куда-то сохранить!</div>
`,
    task: `Дана строка <code>text = "  Python это круто  "</code>. Создайте переменные:<br>
      • <code>clean</code> — текст без пробелов по краям<br>
      • <code>upper</code> — <code>clean</code> в верхнем регистре<br>
      • <code>lower</code> — <code>clean</code> в нижнем регистре<br>
      • <code>length</code> — длина <code>clean</code><br>
      • <code>words</code> — список слов из <code>clean</code><br>
      • <code>replaced</code> — <code>clean</code> с заменой «круто» на «супер»`,
    starter: String.raw`text = "  Python это круто  "

# Ваш код ниже

    theory: String.raw`
<p><strong>Срез</strong> — это способ получить часть последовательности. Синтаксис: <code>[начало:конец:шаг]</code>. Правая граница не включается.</p>
<pre><code>data = [10, 20, 30, 40, 50, 60, 70, 80]

data[:3]      # [10, 20, 30]        первые три
data[2:5]     # [30, 40, 50]        с индекса 2 по 4
data[-2:]     # [70, 80]            последние два
data[3:]      # [40, 50, 60, 70, 80] с индекса 3 до конца
data[:]       # копия всего списка</code></pre>
<p>Шаг позволяет выбирать каждый n-й элемент или разворачивать:</p>
<pre><code>data[::2]     # [10, 30, 50, 70]   каждый второй

<p><strong>Генератор списка</strong> — компактный способ создать список одной строкой. Это одна из самых любимых конструкций Python-разработчиков.</p>

<p><strong>Функция</strong> — это именованный блок кода, который можно вызывать многократно. Функции объявляются словом <code>def</code>:</p>

<p>Разбор синтаксиса:</p>
<ul>
  <li><code>def</code> — ключевое слово</li>
  <li><code>greet</code> — имя функции</li>
  <li><code>(name)</code> — <strong>параметры</strong> (входные данные)</li>

  <li><code>return</code> — возвращает результат вызывающему коду</li>
</ul>

<pre><code>def say_hi():

result = say_hi()    # напечатает "Привет"
print(result)        # None</code></pre>
<p><code>return</code> немедленно завершает выполнение функции:</p>
<pre><code>def check(n):
    if n &lt; 0:
        return "отрицательное"
    return "неотрицательное"</code></pre>

<p><strong>Лямбда-функция</strong> — это короткая анонимная функция, записанная в одну строку:</p>
<pre><code>double = lambda x: x * 2
print(double(5))     # 10

add = lambda a, b: a + b
print(add(2, 3))     # 5</code></pre>
<p>Чаще всего лямбды используют как аргумент других функций.</p>
<p><code>map()</code> применяет функцию к каждому элементу:</p>
<pre><code>nums = [1, 2, 3, 4]
doubled = list(map(lambda x: x * 2, nums))
# [2, 4, 6, 8]</code></pre>
<p><code>filter()</code> оставляет только элементы, для которых функция вернула <code>True</code>:</p>
<pre><code>odds = list(filter(lambda x: x % 2 == 1, nums))
# [1, 3]</code></pre>
<p><code>sorted()</code> с параметром <code>key</code> — очень мощный инструмент:</p>
<pre><code>words = ["банан", "яблоко", "киви"]
sorted(words, key=len)              # ['киви', 'банан', 'яблоко']
sorted(words, key=len, reverse=True)  # ['яблоко', 'банан', 'киви']
max(words, key=len)                 # 'яблоко'</code></pre>
<div class="tip">Сортировать список словарей можно так: <code>sorted(users, key=lambda u: u["age"])</code>.</div>

<p>Переменные, созданные внутри функции, существуют только внутри неё — это <strong>локальная область видимости</strong>:</p>
<pre><code>def f():
    x = 10      # локальная
    return x

f()
print(x)        # NameError: name 'x' is not defined</code></pre>
<p>Функция может <strong>читать</strong> внешние переменные, но чтобы их изменить, нужны ключевые слова:</p>
<pre><code>counter = 0

def increment():
    global counter
    counter += 1</code></pre>
<p>Более изящный приём — <strong>замыкание</strong>: функция, которая «запоминает» переменную из внешней функции. Ключевое слово <code>nonlocal</code> позволяет её менять:</p>
<pre><code>def make_counter():
    count = 0
    def increment():
        nonlocal count
        count += 1
        return count
    return increment

c = make_counter()
print(c())   # 1
print(c())   # 2
print(c())   # 3</code></pre>
<p>Каждый вызов <code>make_counter()</code> создаёт независимый счётчик со своим <code>count</code>.</p>

<p><strong>Класс</strong> — это шаблон для создания объектов. <strong>Объект</strong> — конкретный экземпляр класса.</p>
<pre><code>class Dog:
    def __init__(self, name, age):
        self.name = name
        self.age = age

    def bark(self):
        return f"{self.name} говорит Гав!"

    def birthday(self):
        self.age += 1

rex = Dog("Рекс", 3)
print(rex.name)       # Рекс
print(rex.bark())     # Рекс говорит Гав!
rex.birthday()
print(rex.age)        # 4</code></pre>
<p>Разбор:</p>
<ul>
  <li><code>class Dog:</code> — объявление класса (имя с большой буквы)</li>
  <li><code>__init__</code> — <strong>конструктор</strong>, вызывается при создании объекта</li>
  <li><code>self</code> — ссылка на сам объект; всегда первый параметр методов</li>
  <li><code>self.name = name</code> — создание <strong>атрибута</strong> объекта</li>
</ul>
<p>Атрибуты можно менять напрямую: <code>rex.age = 5</code>.</p>
<div class="tip">Хорошая практика — <code>__init__</code> отвечает только за создание атрибутов, а логика живёт в отдельных методах.</div>

<p><strong>Наследование</strong> позволяет создать новый класс на основе существующего, переиспользуя его код.</p>
<pre><code>class Animal:
    def __init__(self, name):
        self.name = name

    def speak(self):
        return "..."

    def describe(self):
        return f"{self.name} говорит {self.speak()}"


class Dog(Animal):
    def speak(self):
        return "Гав"


class Cat(Animal):
    def speak(self):
        return "Мяу"</code></pre>
<pre><code>d = Dog("Рекс")

<p>Класс <code>Dog</code> <strong>наследует</strong> от <code>Animal</code>: он получил <code>__init__</code> и <code>describe</code> бесплатно, а метод <code>speak</code> <strong>переопределил</strong>.</p>
<p>Чтобы вызвать реализацию родителя, используется <code>super()</code>:</p>
<pre><code>class Puppy(Animal):
    def __init__(self, name, age):
        super().__init__(name)   # вызов __init__ родителя
        self.age = age</code></pre>
<p>Это называется <strong>полиморфизмом</strong>: разные объекты по-разному отвечают на один и тот же вызов <code>speak()</code>.</p>

<p><strong>Магические методы</strong> (dunder-методы, от <em>double underscore</em>) позволяют объектам вести себя как встроенные типы.</p>
<pre><code>class Vector:
    def __init__(self, x, y):
        self.x = x
        self.y = y

    def __str__(self):
        return f"Vector({self.x}, {self.y})"

    def __repr__(self):
        return self.__str__()

    def __add__(self, other):
        return Vector(self.x + other.x, self.y + other.y)

    def __eq__(self, other):
        return self.x == other.x and self.y == other.y

    def __len__(self):
        return 2</code></pre>

print(len(v))         # 2

  <li><code>__len__</code> — <code>len(obj)</code></li>

</ul>

    id: "l26", title: "Обработка исключений: try / except",
    theory: String.raw`
<p>Ошибки во время выполнения называются <strong>исключениями</strong>. Их можно перехватывать, чтобы программа не падала:</p>
<pre><code>try:
    result = 10 / 0
except ZeroDivisionError:
    print("На ноль делить нельзя!")
    result = None</code></pre>
<p>Полная конструкция состоит из четырёх блоков:</p>
<pre><code>try:
    number = int("abc")
except ValueError as e:
    print("Ошибка значения:", e)
except (TypeError, KeyError):
    print("Другая ошибка")
else:
    print("Ошибок не было")     # выполняется, если исключения не случилось
finally:
    print("Выполнится всегда")  # например, закрытие файла</code></pre>
<p>Частые типы исключений:</p>
<ul>
  <li><code>ValueError</code> — неверное значение (<code>int("abc")</code>)</li>
  <li><code>TypeError</code> — неверный тип (<code>"a" + 1</code>)</li>
  <li><code>ZeroDivisionError</code> — деление на ноль</li>
  <li><code>KeyError</code> — отсутствующий ключ словаря</li>
  <li><code>IndexError</code> — выход за границы списка</li>
  <li><code>FileNotFoundError</code> — файл не найден</li>
</ul>
<div class="tip">Ловите конкретные исключения, а не «голый» <code>except:</code> — иначе вы спрячете настоящие баги.</div>
`,

      • <code>to_int(s)</code> — преобразует строку в целое число; если не получается, возвращает <code>None</code><br>
      • <code>safe_divide(a, b)</code> — возвращает результат деления или <code>None</code> при делении на ноль<br>
      • <code>get_item(lst, i)</code> — возвращает элемент списка по индексу или строку <code>"нет"</code>, если индекса не существует`,

    id: "l27", title: "raise и собственные исключения",
    theory: String.raw`
<p>Иногда нужно самому сообщить об ошибке — для этого служит <code>raise</code>:</p>
<pre><code>def set_age(age):
    if age &lt; 0:
        raise ValueError("Возраст не может быть отрицательным")
    return age</code></pre>
<p>Можно создавать <strong>собственные классы исключений</strong> — просто унаследовав их от <code>Exception</code>:</p>
<pre><code>class ValidationError(Exception):
    """Ошибка проверки данных."""
    pass

def register(name):
    if not name:
        raise ValidationError("Имя не может быть пустым")
    return name</code></pre>
<p>Такие исключения удобно ловить отдельно от остальных:</p>
<pre><code>try:
    register("")
except ValidationError as e:
    print("Проблема с данными:", e)</code></pre>
<p>Полезные встроенные исключения для <code>raise</code>: <code>ValueError</code>, <code>TypeError</code>, <code>KeyError</code>, <code>NotImplementedError</code>.</p>
<div class="tip">Сообщение в исключении должно объяснять <em>что пошло не так</em> — оно попадёт в логи и поможет при отладке.</div>
`,
    task: `Создайте:<br>
      • класс исключения <code>ValidationError</code>, унаследованный от <code>Exception</code><br>
      • функцию <code>check_age(age)</code>, которая:<br>
      &nbsp;&nbsp;— выбрасывает <code>TypeError</code>, если <code>age</code> не является целым числом<br>
      &nbsp;&nbsp;— выбрасывает <code>ValidationError</code>, если <code>age &lt; 0</code> или <code>age &gt; 150</code><br>
      &nbsp;&nbsp;— иначе возвращает <code>age</code>`,
    starter: String.raw`# Создайте класс исключения и функцию ниже
`,
    solution: String.raw`class ValidationError(Exception):
    pass

def check_age(age):
    if not isinstance(age, int) or isinstance(age, bool):
        raise TypeError("Возраст должен быть целым числом")
    if age < 0:
        raise ValidationError("Возраст не может быть отрицательным")
    if age > 150:
        raise ValidationError("Возраст слишком большой")
    return age`,

<p><strong>Генератор</strong> — это функция, которая выдаёт значения по одному, вместо того чтобы строить весь список сразу. Вместо <code>return</code> используется <code>yield</code>:</p>
<pre><code>def countdown(n):
    while n &gt; 0:
        yield n
        n -= 1

for value in countdown(3):
    print(value)      # 3 2 1</code></pre>
<p>Важно: при вызове <code>countdown(3)</code> тело функции <strong>не выполняется</strong>. Возвращается объект-генератор, который выдаёт значения по запросу.</p>
<pre><code>gen = countdown(3)
print(next(gen))   # 3
print(next(gen))   # 2
print(list(gen))   # [1]  — генератор исчерпался</code></pre>
<p>Генераторы экономят память: они не хранят всю последовательность, а вычисляют элементы на лету. Это критично для больших объёмов данных.</p>
<pre><code>def fibonacci(n):
    a, b = 0, 1
    for _ in range(n):
        yield a
        a, b = b, a + b

<div class="tip">Выражения-генераторы выглядят как list comprehension, но в круглых скобках: <code>(n**2 for n in range(5))</code>.</div>

const STORAGE_KEY = "pycamp_progress_v1";
const DRAFT_KEY   = "pycamp_drafts_v1";

let current = 0;
let pyodide = null;
let pyodideLoading = false;
let completed = loadJSON(STORAGE_KEY, {});
let drafts = loadJSON(DRAFT_KEY, {});

function loadJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; }
  catch (e) { return fallback; }
}
function saveJSON(key, obj) {
  try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
}

/* ============================================================
   ЭЛЕМЕНТЫ
   ============================================================ */
const $ = id => document.getElementById(id);
const navEl = $("nav");
const codeEl = $("code");
const hlEl = $("hlCode");
const hlPre = $("highlight");
const outputEl = $("output");
const resultEl = $("result");
const progressBar = $("progressBar");
const progressText = $("progressText");
const loader = $("loader");
const loaderText = $("loaderText");
const sidebar = $("sidebar");

/* ============================================================
   ПОДСВЕТКА СИНТАКСИСА
   ============================================================ */
const PY_RE = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|import|from|as|try|except|finally|raise|with|lambda|pass|break|continue|global|nonlocal|yield|assert|del|async|await)\b|\b(\d+\.?\d*)\b|\b(print|len|range|str|int|float|list|dict|set|tuple|sum|min|max|abs|sorted|enumerate|zip|map|filter|input|type|isinstance|open|round|any|all|reversed|bool|super|next|callable|globals|locals|hasattr|getattr|setattr)\b/g;

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function highlight(code) {
  let out = "", last = 0, m;
  PY_RE.lastIndex = 0;
  while ((m = PY_RE.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "t-com" : m[2] ? "t-str" : m[3] ? "t-kw" : m[4] ? "t-num" : "t-bi";
    out += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
    last = m.index + m[0].length;
    if (m[0].length === 0) PY_RE.lastIndex++;
  }
  out += esc(code.slice(last));
  return out + "\n";
}

function refreshHighlight() {
  hlEl.innerHTML = highlight(codeEl.value);
  hlPre.scrollTop = codeEl.scrollTop;
  hlPre.scrollLeft = codeEl.scrollLeft;
}

codeEl.addEventListener("input", () => {
  refreshHighlight();
  drafts[LESSONS[current].id] = codeEl.value;
  saveJSON(DRAFT_KEY, drafts);
});
codeEl.addEventListener("scroll", () => {
  hlPre.scrollTop = codeEl.scrollTop;
  hlPre.scrollLeft = codeEl.scrollLeft;
});
codeEl.addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    const s = codeEl.selectionStart, en = codeEl.selectionEnd;
    codeEl.value = codeEl.value.slice(0, s) + "    " + codeEl.value.slice(en);
    codeEl.selectionStart = codeEl.selectionEnd = s + 4;
    refreshHighlight();
    drafts[LESSONS[current].id] = codeEl.value;
    saveJSON(DRAFT_KEY, drafts);
  }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    runCode(true);
  }
});

function buildNav() {
  let html = "";
  COURSE.forEach((mod, mi) => {
    html += '<div class="nav-module"><div class="nav-module-title">Модуль ' + (mi + 1) + " · " + esc(mod.title) + "</div>";
    mod.lessons.forEach((l, li) => {
      const idx = LESSONS.findIndex(x => x.id === l.id);
      const done = completed[l.id] ? " done" : "";
      html += '<div class="nav-item' + done + '" data-i="' + idx + '">' +
              '<span class="check">✓</span><span>' + esc(l.title) + "</span></div>";
    });
    html += "</div>";
  });
  navEl.innerHTML = html;
  navEl.querySelectorAll(".nav-item").forEach(el => {
    el.addEventListener("click", () => {
      goTo(parseInt(el.dataset.i, 10));
      sidebar.classList.remove("open");
    });
  });
}

function updateProgress() {
  const total = LESSONS.length;
  const done = LESSONS.filter(l => completed[l.id]).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  progressBar.style.width = pct + "%";
  progressText.textContent = done + " / " + total + " (" + pct + "%)";
}

function markDone(id) {
  if (!completed[id]) {
    completed[id] = true;
    saveJSON(STORAGE_KEY, completed);
    buildNav();
    updateProgress();
  }
}

function goTo(index) {
  if (index < 0 || index >= LESSONS.length) return;
  current = index;
  const l = LESSONS[index];

  $("lessonTitle").textContent = l.title;
  $("lessonMeta").textContent = "Модуль " + (l.mi + 1) + " · " + l.moduleTitle +
                                 "  •  Урок " + (index + 1) + " из " + LESSONS.length;
  $("theory").innerHTML = l.theory;
  $("task").innerHTML = l.task;

  codeEl.value = (drafts[l.id] !== undefined) ? drafts[l.id] : l.starter;
  refreshHighlight();

  outputEl.textContent = "Нажмите «Запустить», чтобы выполнить код.";
  outputEl.style.color = "";
  resultEl.className = "result hide";
  resultEl.innerHTML = "";

  navEl.querySelectorAll(".nav-item").forEach(el => {
    el.classList.toggle("active", parseInt(el.dataset.i, 10) === index);
  });

  $("prevBtn").disabled = index === 0;
  $("nextBtn").textContent = index === LESSONS.length - 1 ? "Завершить ✓" : "Далее →";

  document.querySelector(".content").scrollTop = 0;
}

/* ============================================================
   PYODIDE
   ============================================================ */
async function ensurePyodide() {
  if (pyodide) return;
  if (pyodideLoading) {
    while (pyodideLoading) await new Promise(r => setTimeout(r, 120));
    return;
  }
  pyodideLoading = true;
  loader.classList.remove("hide");
  loaderText.textContent = "Загрузка интерпретатора Python… Это может занять 10–20 секунд при первом запуске.";
  try {
    pyodide = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"
    });
  } catch (e) {
    loaderText.innerHTML = "⚠ Не удалось загрузить Python.<br>Проверьте подключение к интернету и обновите страницу.";
    pyodideLoading = false;
    throw e;
  }
  loader.classList.add("hide");
  pyodideLoading = false;
}

function buildScript(code, tests) {
  return `
import io, contextlib, traceback
_CODE = ${JSON.stringify(code)}
_TESTS = ${JSON.stringify(tests || "")}
_RUN_TESTS = ${tests ? "True" : "False"}
_ns = {"__name__": "__main__"}
_buf = io.StringIO()
_err = None
try:
    with contextlib.redirect_stdout(_buf):
        exec(_CODE, _ns)
except Exception:
    _err = traceback.format_exc()
OUTPUT = _buf.getvalue()
if _err is not None:
    RESULT = "error"
    MESSAGE = _err
elif not _RUN_TESTS:
    RESULT = "ran"
    MESSAGE = ""
else:
    _ns["OUT"] = OUTPUT
    try:
        exec(_TESTS, _ns)
        RESULT = "pass"
        MESSAGE = ""
    except AssertionError as _e:
        RESULT = "fail"
        MESSAGE = str(_e) or "Проверка не пройдена"
    except Exception:
        RESULT = "error"
        MESSAGE = traceback.format_exc()
`;
}

async function runPython(code, tests) {
  await ensurePyodide();
  pyodide.runPython(buildScript(code, tests));
  const out = pyodide.globals.get("OUTPUT");
  const res = pyodide.globals.get("RESULT");
  const msg = pyodide.globals.get("MESSAGE");
  return {
    out: typeof out === "string" ? out : "",
    result: typeof res === "string" ? res : "error",
    message: typeof msg === "string" ? msg : ""
  };
}

/* ============================================================
   ЗАПУСК / ПРОВЕРКА
   ============================================================ */
let busy = false;

function setBusy(state) {
  busy = state;
  $("runBtn").disabled = state;
  $("checkBtn").disabled = state;
  $("runBtn").textContent = state ? "⏳ Работает…" : "▶ Запустить";
}

function showOutput(text, isError) {
  outputEl.textContent = text && text.length ? text : "(нет вывода)";
  outputEl.style.color = isError ? "#ff9b95" : "";
}

async function runCode(withTests) {
  if (busy) return;
  setBusy(true);
  resultEl.className = "result hide";
  try {
    const lesson = LESSONS[current];
    const { out, result, message } = await runPython(codeEl.value, withTests ? lesson.tests : null);

    if (!withTests) {
      showOutput(out, result === "error");
      if (result === "error") {
        resultEl.className = "result fail";
        resultEl.innerHTML = '<span class="icon">✖</span><div><b>Ошибка выполнения</b><pre>' +
          esc(message) + "</pre></div>";
      }
      return;
    }

    if (result === "pass") {
      showOutput(out, false);
      resultEl.className = "result pass";
      resultEl.innerHTML = '<span class="icon">✔</span><div><b>Отлично! Все проверки пройдены.</b><br>' +
        "Урок засчитан.</div>";
      markDone(lesson.id);
    } else if (result === "fail") {
      showOutput(out, false);
      resultEl.className = "result fail";
      resultEl.innerHTML = '<span class="icon">✖</span><div><b>Почти получилось!</b><br>' +
        esc(message) + "</div>";
    } else {
      showOutput(out, true);
      resultEl.className = "result fail";
      resultEl.innerHTML = '<span class="icon">⚠</span><div><b>В коде ошибка</b><pre>' +
        esc(message) + "</pre></div>";
    }
  } catch (e) {
    resultEl.className = "result fail";
    resultEl.innerHTML = '<span class="icon">⚠</span><div>' + esc(String(e)) + "</div>";
  } finally {
    setBusy(false);
  }
}

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
$("runBtn").addEventListener("click", () => runCode(false));
$("checkBtn").addEventListener("click", () => runCode(true));

$("prevBtn").addEventListener("click", () => goTo(current - 1));
$("nextBtn").addEventListener("click", () => {
  if (current === LESSONS.length - 1) {
    const done = LESSONS.filter(l => completed[l.id]).length;
    alert("🎉 Курс завершён!\n\nПройдено уроков: " + done + " из " + LESSONS.length +
          "\n\nПродолжайте практиковаться — попробуйте написать свой проект!");
    return;
  }
  goTo(current + 1);
});

$("resetCodeBtn").addEventListener("click", () => {
  if (!confirm("Вернуть исходный код урока? Ваши изменения будут потеряны.")) return;
  codeEl.value = LESSONS[current].starter;
  drafts[LESSONS[current].id] = codeEl.value;
  saveJSON(DRAFT_KEY, drafts);
  refreshHighlight();
});

$("solutionBtn").addEventListener("click", () => {
  if (!confirm("Показать готовое решение? Попробуйте сначала решить самостоятельно — так знания закрепляются лучше.")) return;
  codeEl.value = LESSONS[current].solution;
  drafts[LESSONS[current].id] = codeEl.value;
  saveJSON(DRAFT_KEY, drafts);
  refreshHighlight();
});

$("resetBtn").addEventListener("click", () => {
  if (!confirm("Сбросить весь прогресс и черновики кода?")) return;
  completed = {};
  drafts = {};
  saveJSON(STORAGE_KEY, completed);
  saveJSON(DRAFT_KEY, drafts);
  buildNav();
  updateProgress();
  goTo(0);
});

$("burger").addEventListener("click", () => sidebar.classList.toggle("open"));

document.addEventListener("click", e => {
  if (window.innerWidth <= 900 &&
      sidebar.classList.contains("open") &&
      !sidebar.contains(e.target) &&
      e.target.id !== "burger") {
    sidebar.classList.remove("open");
  }
});

/* ============================================================
   СТАРТ
   ============================================================ */
buildNav();
updateProgress();
goTo(0);
</script>
</body>
</html>
