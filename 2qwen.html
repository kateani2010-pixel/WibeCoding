<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyLearn — Бесплатный курс Python</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::selection { background: rgba(74, 222, 128, 0.3); color: white; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #5a5a7a; }
        textarea::-webkit-scrollbar { width: 6px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 3px; }
        pre, code, textarea { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', monospace; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }
        .app { display: flex; flex-direction: column; height: 100vh; }

        /* Header */
        .header {
            flex-shrink: 0;
            background: #0a0a1a;
            border-bottom: 1px solid #2d2d4a;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .logo { display: flex; align-items: center; gap: 8px; }
        .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #4ade80, #3b82f6);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .logo-text {
            font-size: 20px; font-weight: bold;
            background: linear-gradient(to right, #4ade80, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-subtitle { color: #9ca3af; font-size: 14px; margin-left: 16px; }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .progress-bar { width: 128px; height: 8px; background: #374151; border-radius: 9999px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(to right, #4ade80, #3b82f6); transition: width 0.5s; border-radius: 9999px; }
        .progress-text { font-size: 14px; color: #9ca3af; }
        .trophy-badge {
            display: flex; align-items: center; gap: 4px;
            background: #1f2937; border-radius: 8px; padding: 6px 12px;
        }
        .trophy-badge i { color: #facc15; font-size: 14px; }
        .trophy-badge span { font-size: 14px; font-weight: bold; }
        .menu-btn { display: none; padding: 8px; background: none; border: none; color: white; cursor: pointer; font-size: 18px; }

        /* Main layout */
        .main-layout { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar */
        .sidebar {
            width: 280px; flex-shrink: 0;
            background: #0d0d1a;
            border-right: 1px solid #2d2d4a;
            overflow-y: auto;
            padding: 16px;
            transition: transform 0.3s;
        }
        .sidebar-title {
            font-size: 12px; font-weight: bold; color: #9ca3af;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
        }
        .section-group { margin-bottom: 16px; }
        .section-name {
            font-size: 11px; font-weight: bold; color: #4ade80;
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 8px; padding: 0 8px;
        }
        .lesson-btn {
            width: 100%; text-align: left;
            padding: 8px 12px; border-radius: 8px;
            margin-bottom: 4px; display: flex; align-items: center; gap: 8px;
            background: none; border: none; color: #d1d5db;
            cursor: pointer; font-size: 13px; transition: all 0.2s;
        }
        .lesson-btn:hover { background: #1f2937; }
        .lesson-btn.active { background: rgba(74, 222, 128, 0.15); color: #86efac; border: 1px solid rgba(74, 222, 128, 0.3); }
        .lesson-num {
            flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; background: #374151; color: #9ca3af;
        }
        .lesson-btn.active .lesson-num { background: rgba(74, 222, 128, 0.3); color: #86efac; }
        .lesson-btn.completed .lesson-num { background: #22c55e; color: white; }
        .lesson-title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Content */
        .content { flex: 1; overflow-y: auto; }
        .content-header {
            position: sticky; top: 0;
            background: rgba(15, 15, 26, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #2d2d4a;
            padding: 16px 32px; z-index: 10;
            display: flex; align-items: center; justify-content: space-between;
        }
        .lesson-meta { font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
        .lesson-heading { font-size: 24px; font-weight: bold; }
        .nav-btns { display: flex; gap: 8px; }
        .nav-btn {
            padding: 8px; border-radius: 8px; background: #1f2937;
            border: none; color: white; cursor: pointer; transition: background 0.2s;
        }
        .nav-btn:hover { background: #374151; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .content-body { padding: 32px; max-width: 1200px; margin: 0 auto; }
        .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

        /* Panels */
        .panel {
            background: rgba(31, 41, 55, 0.5);
            border: 1px solid #374151;
            border-radius: 12px; padding: 24px;
        }
        .panel-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
        .panel-header i { font-size: 16px; }
        .panel-header h3 { font-size: 18px; font-weight: bold; }

        /* Theory */
        .theory-content { color: #e2e8f0; line-height: 1.7; }
        .theory-content h1 { font-size: 24px; font-weight: bold; color: white; margin: 16px 0 8px; }
        .theory-content h2 { font-size: 20px; font-weight: bold; color: white; margin: 16px 0 8px; }
        .theory-content h3 { font-size: 16px; font-weight: bold; color: white; margin: 12px 0 6px; }
        .theory-content p { margin: 4px 0; }
        .theory-content strong { color: #fde047; font-weight: 600; }
        .theory-content code {
            background: #374151; color: #86efac;
            padding: 2px 6px; border-radius: 4px; font-size: 13px;
        }
        .theory-content pre {
            background: #1e1e2e; border: 1px solid #374151;
            border-radius: 8px; padding: 16px; margin: 12px 0;
            overflow-x: auto;
        }
        .theory-content pre code { background: none; padding: 0; color: #86efac; font-size: 13px; }
        .theory-content ul { margin: 4px 0 4px 16px; }
        .theory-content li { margin: 4px 0; }
        .theory-content li::marker { color: #4ade80; }
        .theory-content table { width: 100%; border-collapse: collapse; margin: 12px 0; }
        .theory-content th { border: 1px solid #4b5563; background: #1f2937; padding: 8px 12px; text-align: left; font-size: 13px; }
        .theory-content td { border: 1px solid #4b5563; padding: 8px 12px; font-size: 13px; }

        /* Examples */
        .example-block {
            background: #1e1e2e; border: 1px solid #374151;
            border-radius: 8px; padding: 12px; margin-bottom: 12px;
            overflow-x: auto;
        }
        .example-block code { color: #86efac; font-size: 13px; }

        /* Task */
        .task-panel {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(147, 51, 234, 0.1));
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px; padding: 24px; margin-top: 24px;
        }
        .task-panel .panel-header i { color: #60a5fa; }
        .task-text { color: #e2e8f0; line-height: 1.6; }
        .hint-btn {
            margin-top: 16px; display: flex; align-items: center; gap: 8px;
            background: none; border: none; color: #facc15;
            cursor: pointer; font-size: 14px; transition: color 0.2s;
        }
        .hint-btn:hover { color: #fde047; }
        .hint-box {
            margin-top: 8px; padding: 12px;
            background: rgba(250, 204, 21, 0.1);
            border: 1px solid rgba(250, 204, 21, 0.3);
            border-radius: 8px; color: #fef08a; font-size: 14px;
        }

        /* Code Editor */
        .editor-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .editor-actions { display: flex; gap: 8px; }
        .btn-run {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; background: #2563eb; border: none;
            border-radius: 8px; color: white; font-size: 14px;
            font-weight: 500; cursor: pointer; transition: background 0.2s;
        }
        .btn-run:hover { background: #3b82f6; }
        .btn-check {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; background: #16a34a; border: none;
            border-radius: 8px; color: white; font-size: 14px;
            font-weight: 500; cursor: pointer; transition: background 0.2s;
        }
        .btn-check:hover { background: #22c55e; }

        .editor-wrapper {
            display: flex; border-radius: 8px; overflow: hidden;
            border: 1px solid #374151; background: #1e1e2e;
        }
        .line-numbers {
            flex-shrink: 0; padding: 12px 8px;
            background: #181825; border-right: 1px solid #374151;
            text-align: right; color: #6b7280; font-size: 12px;
            line-height: 24px; user-select: none; min-width: 48px;
            overflow: hidden;
        }
        .code-textarea {
            flex: 1; background: transparent; border: none;
            color: #e2e8f0; padding: 12px; font-size: 14px;
            line-height: 24px; resize: none; outline: none;
            min-height: 200px; tab-size: 4;
        }

        /* Console */
        .console-panel { margin-top: 16px; }
        .console-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .console-header i { color: #9ca3af; }
        .result-badge {
            margin-left: auto; padding: 4px 8px;
            border-radius: 4px; font-size: 12px; font-weight: bold;
        }
        .result-badge.success { background: rgba(34, 197, 94, 0.2); color: #86efac; }
        .result-badge.error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .console-output {
            background: #1e1e2e; border: 1px solid #374151;
            border-radius: 8px; padding: 16px;
            min-height: 120px; font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            white-space: pre-wrap; color: #d1d5db;
        }
        .console-output.success { color: #86efac; }
        .console-output.error { color: #fca5a5; }

        /* Bottom nav */
        .bottom-nav { display: flex; justify-content: space-between; margin-top: 24px; }
        .btn-prev, .btn-next {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: 8px;
            border: none; font-size: 14px; cursor: pointer;
            transition: background 0.2s;
        }
        .btn-prev { background: #1f2937; color: white; }
        .btn-prev:hover { background: #374151; }
        .btn-next { background: #16a34a; color: white; font-weight: 500; }
        .btn-next:hover { background: #22c55e; }
        .btn-prev:disabled, .btn-next:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Mobile tabs */
        .mobile-tabs { display: none; gap: 8px; margin-bottom: 16px; }
        .mobile-tab {
            flex: 1; padding: 8px 16px; border-radius: 8px;
            border: none; font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
            background: #1f2937; color: #9ca3af;
        }
        .mobile-tab.active { background: rgba(74, 222, 128, 0.2); color: #86efac; }

        /* Responsive */
        @media (max-width: 1024px) {
            .panels { grid-template-columns: 1fr; }
            .header-subtitle { display: none; }
            .progress-bar { display: none; }
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed; top: 0; left: 0; height: 100%;
                z-index: 40; transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay {
                display: none; position: fixed; inset: 0;
                background: rgba(0,0,0,0.5); z-index: 39;
            }
            .sidebar-overlay.open { display: block; }
            .menu-btn { display: block; }
            .mobile-tabs { display: flex; }
            .panel.theory-panel.hidden-mobile { display: none; }
            .panel.code-panel.hidden-mobile { display: none; }
            .content-header { padding: 12px 16px; }
            .content-body { padding: 16px; }
            .lesson-heading { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
                <div class="logo">
                    <div class="logo-icon">🐍</div>
                    <span class="logo-text">PyLearn</span>
                </div>
                <span class="header-subtitle">Бесплатный курс Python</span>
            </div>
            <div class="header-right">
                <div style="display:flex;align-items:center;gap:8px;">
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                    <span class="progress-text" id="progressText">0%</span>
                </div>
                <div class="trophy-badge">
                    <i class="fas fa-trophy"></i>
                    <span id="trophyCount">0/24</span>
                </div>
            </div>
        </header>

        <div class="main-layout">
            <!-- Sidebar overlay -->
            <div class="sidebar-overlay" id="sidebarOverlay"></div>

            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-title">Программа курса</div>
                <div id="sidebarContent"></div>
            </aside>

            <!-- Content -->
            <main class="content" id="mainContent">
                <div class="content-header">
                    <div>
                        <div class="lesson-meta" id="lessonMeta"></div>
                        <h2 class="lesson-heading" id="lessonTitle"></h2>
                    </div>
                    <div class="nav-btns">
                        <button class="nav-btn" id="prevBtnTop"><i class="fas fa-chevron-left"></i></button>
                        <button class="nav-btn" id="nextBtnTop"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="content-body">
                    <!-- Mobile tabs -->
                    <div class="mobile-tabs">
                        <button class="mobile-tab active" id="tabTheory"><i class="fas fa-book"></i> Теория</button>
                        <button class="mobile-tab" id="tabCode"><i class="fas fa-code"></i> Практика</button>
                    </div>

                    <div class="panels">
                        <!-- Theory Panel -->
                        <div class="panel theory-panel" id="theoryPanel">
                            <div class="panel-header">
                                <i class="fas fa-book-open" style="color:#4ade80"></i>
                                <h3>Теория</h3>
                            </div>
                            <div class="theory-content" id="theoryContent"></div>

                            <div style="margin-top:24px;">
                                <div class="panel-header">
                                    <i class="fas fa-lightbulb" style="color:#facc15"></i>
                                    <h3>Примеры</h3>
                                </div>
                                <div id="examplesContent"></div>
                            </div>

                            <div class="task-panel">
                                <div class="panel-header">
                                    <i class="fas fa-tasks"></i>
                                    <h3>Задание</h3>
                                </div>
                                <p class="task-text" id="taskText"></p>
                                <button class="hint-btn" id="hintBtn">
                                    <i class="fas fa-eye"></i>
                                    <span>Показать подсказку</span>
                                </button>
                                <div class="hint-box" id="hintBox" style="display:none"></div>
                            </div>
                        </div>

                        <!-- Code Panel -->
                        <div class="panel code-panel" id="codePanel">
                            <div class="editor-toolbar">
                                <div class="panel-header" style="margin-bottom:0">
                                    <i class="fas fa-code" style="color:#4ade80"></i>
                                    <h3>Редактор кода</h3>
                                </div>
                                <div class="editor-actions">
                                    <button class="btn-run" id="runBtn"><i class="fas fa-play" style="font-size:11px"></i> Запустить</button>
                                    <button class="btn-check" id="checkBtn"><i class="fas fa-check" style="font-size:11px"></i> Проверить</button>
                                </div>
                            </div>
                            <div class="editor-wrapper">
                                <div class="line-numbers" id="lineNumbers">1</div>
                                <textarea class="code-textarea" id="codeEditor" spellcheck="false"></textarea>
                            </div>

                            <div class="console-panel">
                                <div class="console-header">
                                    <i class="fas fa-terminal"></i>
                                    <h3 style="font-weight:bold">Консоль</h3>
                                    <span class="result-badge" id="resultBadge" style="display:none"></span>
                                </div>
                                <div class="console-output" id="consoleOutput">Нажмите "Запустить" для выполнения кода...</div>
                            </div>

                            <div class="bottom-nav">
                                <button class="btn-prev" id="prevBtnBottom"><i class="fas fa-arrow-left"></i> Предыдущий</button>
                                <button class="btn-next" id="nextBtnBottom">Следующий <i class="fas fa-arrow-right"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
    // ==================== ДАННЫЕ КУРСА ====================
    const lessons = [
        {
            id: 1, title: "Привет, Python!", section: "Основы",
            theory: `# Добро пожаловать в курс Python! 🐍\n\nPython — один из самых популярных языков программирования в мире. Он используется в:\n- Веб-разработке (Django, Flask)\n- Машинном обучении (TensorFlow, PyTorch)\n- Анализе данных (Pandas, NumPy)\n- Автоматизации задач\n\nПервая программа на Python — это вывод текста на экран. Для этого используется функция **print()**.\n\n## Синтаксис\n\`\`\`python\nprint("Текст для вывода")\n\`\`\`\n\nТекст в кавычках называется **строкой** (string). Кавычки могут быть одинарными или двойными.`,
            examples: ['print("Hello, World!")', "print('Привет, мир!')", 'print("Мне нравится Python!")'],
            task: 'Напишите программу, которая выводит на экран: "Hello, Python!"',
            hint: 'Используйте функцию print() с текстом "Hello, Python!" в кавычках',
            initialCode: '# Напишите ваш код здесь\n',
            check: (code) => code.includes('print') && code.includes('Hello, Python!')
        },
        {
            id: 2, title: "Переменные", section: "Основы",
            theory: `# Переменные в Python 📦\n\n**Переменная** — это именованная область памяти для хранения данных. В Python не нужно указывать тип переменной — он определяется автоматически.\n\n## Правила именования:\n- Имя может содержать буквы, цифры и символ подчёркивания _\n- Не может начинаться с цифры\n- Регистр имеет значение (name ≠ Name)\n- Нельзя использовать ключевые слова Python\n\n## Присваивание\n\`\`\`python\nимя = "значение"\n\`\`\`\n\nОператор **=** используется для присваивания значения переменной.`,
            examples: ['name = "Alice"\nage = 25\nprint(name)', 'x = 10\ny = 20\nprint(x + y)', 'message = "Привет"\nprint(message)'],
            task: 'Создайте переменную name со значением "Python" и выведите её на экран с помощью print().',
            hint: 'Сначала создайте переменную: name = "Python", затем: print(name)',
            initialCode: '# Создайте переменную name и выведите её\n',
            check: (code) => code.includes('name') && code.includes('Python') && code.includes('print')
        },
        {
            id: 3, title: "Типы данных", section: "Основы",
            theory: `# Типы данных 📊\n\nPython имеет несколько основных типов данных:\n\n| Тип | Описание | Пример |\n|-----|----------|--------|\n| int | Целые числа | 42, -7, 0 |\n| float | Дробные числа | 3.14, -0.5 |\n| str | Строки | "hello" |\n| bool | Логический | True, False |\n| None | Пустой тип | None |\n\n## Функция type()\nПозволяет узнать тип переменной:\n\`\`\`python\nx = 42\nprint(type(x))  # <class 'int'>\n\`\`\`\n\n## Преобразование типов\n\`\`\`python\nx = int("42")     # строка → число\ny = str(3.14)     # число → строка\nz = float("3.14") # строка → дробное число\n\`\`\``,
            examples: ['x = 42\nprint(type(x))', 'name = "Alice"\nprint(type(name))', 'pi = 3.14\nprint(type(pi))'],
            task: 'Создайте переменную age = 25 и выведите её тип с помощью type().',
            hint: 'Создайте переменную age = 25, затем: print(type(age))',
            initialCode: '# Создайте переменную age и выведите её тип\n',
            check: (code) => code.includes('age') && code.includes('25') && code.includes('type')
        },
        {
            id: 4, title: "Числа и арифметика", section: "Основы",
            theory: `# Арифметические операторы 🔢\n\nPython поддерживает все стандартные математические операции:\n\n| Оператор | Описание | Пример |\n|----------|----------|--------|\n| + | Сложение | 5 + 3 = 8 |\n| - | Вычитание | 5 - 3 = 2 |\n| * | Умножение | 5 * 3 = 15 |\n| / | Деление | 5 / 3 = 1.667 |\n| // | Целочисленное деление | 5 // 3 = 1 |\n| % | Остаток от деления | 5 % 3 = 2 |\n| ** | Возведение в степень | 5 ** 3 = 125 |\n\n## Порядок операций\nPython следует стандартному математическому порядку (PEMDAS):\nскобки → степени → умножение/деление → сложение/вычитание`,

    let currentLesson = 0;

    // ==================== УТИЛИТЫ ====================
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderMarkdown(text) {
        const lines = text.split('\n');
        let html = '';
        let inCodeBlock = false;
        let codeLines = [];
        let inTable = false;
        let tableRows = [];

        function processInline(line) {
            let result = escapeHtml(line);
            // Bold
            result = result.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Inline code
            result = result.replace(/`(.*?)`/g, '<code>$1</code>');
            return result;
        }

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];

            if (line.startsWith('```')) {
                if (inCodeBlock) {
                    html += '<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>';
                    codeLines = [];
                    inCodeBlock = false;
                } else {
                    inCodeBlock = true;
                }
                continue;
            }

            if (inCodeBlock) {
                codeLines.push(line);
                continue;
            }

            if (line.startsWith('|')) {
                const cells = line.split('|').filter(c => c.trim()).map(c => c.trim());
                if (cells.every(c => /^[-:]+$/.test(c))) continue;
                if (!inTable) { inTable = true; tableRows = []; }
                tableRows.push(cells);
                if (i === lines.length - 1 || !lines[i + 1] || !lines[i + 1].startsWith('|')) {
                    html += '<table><thead><tr>';
                    tableRows[0].forEach(cell => { html += '<th>' + processInline(cell) + '</th>'; });
                    html += '</tr></thead><tbody>';
                    tableRows.slice(1).forEach(row => {
                        html += '<tr>';
                        row.forEach(cell => { html += '<td>' + processInline(cell) + '</td>'; });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    inTable = false;
                    tableRows = [];
                }
                continue;
            }

            if (line.startsWith('# ')) {
                html += '<h1>' + processInline(line.substring(2)) + '</h1>';
            } else if (line.startsWith('## ')) {
                html += '<h2>' + processInline(line.substring(3)) + '</h2>';
            } else if (line.startsWith('### ')) {
                html += '<h3>' + processInline(line.substring(4)) + '</h3>';
            } else if (line.startsWith('- ')) {
                html += '<ul><li>' + processInline(line.substring(2)) + '</li></ul>';
            } else if (line.match(/^\d+\. /)) {
                const match = line.match(/^(\d+)\. (.*)/);
                if (match) html += '<ul><li><strong>' + match[1] + '.</strong> ' + processInline(match[2]) + '</li></ul>';
            } else if (line.trim() === '') {
                html += '<br>';
            } else {
                html += '<p>' + processInline(line) + '</p>';
            }
        }

        return html;
    }

    // ==================== РЕНДЕРИНГ ====================
    function renderSidebar() {
        const sections = [...new Set(lessons.map(l => l.section))];
        let html = '';
        sections.forEach(section => {
            html += '<div class="section-group">';
            html += '<div class="section-name">' + section + '</div>';
            lessons.filter(l => l.section === section).forEach(l => {
                const isActive = l.id === lessons[currentLesson].id;
                const isCompleted = completedLessons.has(l.id);
                let cls = 'lesson-btn';
                if (isActive) cls += ' active';
                if (isCompleted) cls += ' completed';
                html += `<button class="${cls}" data-id="${l.id - 1}">`;
                html += `<span class="lesson-num">${isCompleted ? '✓' : l.id}</span>`;
                html += `<span class="lesson-title-text">${l.title}</span>`;
                html += '</button>';
            });
            html += '</div>';
        });
        document.getElementById('sidebarContent').innerHTML = html;

        // Bind events
        document.querySelectorAll('.lesson-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentLesson = parseInt(btn.dataset.id);
                renderLesson();
                closeSidebar();
            });
        });
    }

    function renderLesson() {
        const lesson = lessons[currentLesson];

        // Header
        document.getElementById('lessonMeta').textContent = `Урок ${lesson.id} из ${lessons.length} • ${lesson.section}`;
        document.getElementById('lessonTitle').textContent = lesson.title;

        // Theory
        document.getElementById('theoryContent').innerHTML = renderMarkdown(lesson.theory);

        // Examples
        let exHtml = '';
        lesson.examples.forEach(ex => {
            exHtml += '<div class="example-block"><code>' + escapeHtml(ex) + '</code></div>';
        });
        document.getElementById('examplesContent').innerHTML = exHtml;

        // Task
        document.getElementById('taskText').textContent = lesson.task;
        document.getElementById('hintBox').textContent = '💡 ' + lesson.hint;
        document.getElementById('hintBox').style.display = 'none';
        document.getElementById('hintBtn').innerHTML = '<i class="fas fa-eye"></i><span>Показать подсказку</span>';

        // Code
        document.getElementById('codeEditor').value = lesson.initialCode;
        updateLineNumbers();

        // Console
        document.getElementById('consoleOutput').textContent = 'Нажмите "Запустить" для выполнения кода...';
        document.getElementById('consoleOutput').className = 'console-output';
        document.getElementById('resultBadge').style.display = 'none';

        // Nav buttons
        document.getElementById('prevBtnTop').disabled = currentLesson === 0;
        document.getElementById('nextBtnTop').disabled = currentLesson === lessons.length - 1;
        document.getElementById('prevBtnBottom').disabled = currentLesson === 0;
        document.getElementById('nextBtnBottom').disabled = currentLesson === lessons.length - 1;

        // Progress
        const progress = Math.round((completedLessons.size / lessons.length) * 100);
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressText').textContent = progress + '%';
        document.getElementById('trophyCount').textContent = completedLessons.size + '/' + lessons.length;

        renderSidebar();

        document.getElementById('mainContent').scrollTop = 0;

    function updateLineNumbers() {
        const code = document.getElementById('codeEditor').value;
        const lines = code.split('\n');
        let html = '';
        for (let i = 1; i <= lines.length; i++) {
            html += i + '\n';
        }
        document.getElementById('lineNumbers').textContent = html;
    }

    function runCode() {
        const code = document.getElementById('codeEditor').value;
        const output = document.getElementById('consoleOutput');
        output.textContent = '▶ Выполнение кода...\n';
        output.className = 'console-output';
        document.getElementById('resultBadge').style.display = 'none';

        setTimeout(() => {
            const lines = [];
            const printRegex = /print\((.*?)\)/g;
            let match;

            while ((match = printRegex.exec(code)) !== null) {
                let arg = match[1].trim();
                if ((arg.startsWith('"') && arg.endsWith('"')) || (arg.startsWith("'") && arg.endsWith("'"))) {
                    lines.push(arg.slice(1, -1));
                } else if (arg.startsWith('f"') || arg.startsWith("f'")) {
                    lines.push('[f-строка выведена]');
                } else if (arg.match(/^\d+(\.\d+)?$/)) {
                    lines.push(arg);
                } else if (arg.includes('type(')) {
                    lines.push("<class 'int'>");
                } else if (arg.includes('len(')) {
                    const inner = arg.match(/len\((.*?)\)/);
                    if (inner) {
                        const str = inner[1].match(/"(.*)"/);
                        if (str) lines.push(String(str[1].length));
                        else lines.push('[вычислено]');
                    }
                } else if (arg.includes('**')) {
                    const nums = arg.match(/(\d+)\s*\*\*\s*(\d+)/);
                    if (nums) lines.push(String(Math.pow(parseInt(nums[1]), parseInt(nums[2]))));
                    else lines.push('[вычислено]');
                } else if (arg.includes('math.pi')) {
                    lines.push('3.141592653589793');
                } else if (arg.includes('math.sqrt')) {
                    const num = arg.match(/math\.sqrt\((\d+)\)/);
                    if (num) lines.push(String(Math.sqrt(parseInt(num[1]))));
                    else lines.push('[вычислено]');
                } else if (arg.includes('.upper()')) {
                    lines.push('[строка в верхнем регистре]');
                } else if (arg.includes('range')) {
                    lines.push('[объект range]');
                } else {
                    lines.push('[' + arg + ']');
                }
            }

            if (lines.length > 0) {
                output.textContent = '▶ Результат:\n\n' + lines.join('\n') + '\n\n✅ Код выполнен успешно!';
            } else {
                output.textContent = '▶ Код выполнен (нет вывода через print)\n\n✅ Ошибок не обнаружено!';
            }
        }, 500);
    }

    function checkSolution() {
        const lesson = lessons[currentLesson];
        const code = document.getElementById('codeEditor').value;
        const output = document.getElementById('consoleOutput');
        const badge = document.getElementById('resultBadge');

        if (lesson.check(code)) {
            badge.textContent = '✓ ВЕРНО';
            badge.className = 'result-badge success';
            badge.style.display = 'inline';
            output.textContent = '🎉 Отлично! Задание выполнено верно!\n\nПереходите к следующему уроку.';
            output.className = 'console-output success';
            completedLessons.add(lesson.id);
            localStorage.setItem('pylearn_completed', JSON.stringify([...completedLessons]));
            renderSidebar();
            // Update progress
            const progress = Math.round((completedLessons.size / lessons.length) * 100);
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = progress + '%';
            document.getElementById('trophyCount').textContent = completedLessons.size + '/' + lessons.length;
        } else {
            badge.textContent = '✗ НЕВЕРНО';
            badge.className = 'result-badge error';
            badge.style.display = 'inline';
            output.textContent = '❌ Пока неверно. Проверьте код и попробуйте снова.\n\nПодсказка: ' + lesson.hint;
            output.className = 'console-output error';
        }
    }

        if (currentLesson < lessons.length - 1) {
            currentLesson++;
            renderLesson();
        }
    }

        if (currentLesson > 0) {
            currentLesson--;
            renderLesson();
        }
    }

    function closeSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    }

    // ==================== ИНИЦИАЛИЗАЦИЯ ====================
    document.addEventListener('DOMContentLoaded', () => {
        renderLesson();

        // Code editor events
        const editor = document.getElementById('codeEditor');
        editor.addEventListener('input', updateLineNumbers);
        editor.addEventListener('scroll', () => {
            document.getElementById('lineNumbers').scrollTop = editor.scrollTop;
        });
        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 4;
                updateLineNumbers();
            }
        });

        // Buttons
        document.getElementById('runBtn').addEventListener('click', runCode);
        document.getElementById('checkBtn').addEventListener('click', checkSolution);
        document.getElementById('prevBtnTop').addEventListener('click', prevLesson);
        document.getElementById('nextBtnTop').addEventListener('click', nextLesson);
        document.getElementById('prevBtnBottom').addEventListener('click', prevLesson);
        document.getElementById('nextBtnBottom').addEventListener('click', nextLesson);

        // Hint
        document.getElementById('hintBtn').addEventListener('click', () => {
            const box = document.getElementById('hintBox');
            const btn = document.getElementById('hintBtn');
            if (box.style.display === 'none') {
                box.style.display = 'block';
                btn.innerHTML = '<i class="fas fa-eye-slash"></i><span>Скрыть подсказку</span>';
            } else {
                box.style.display = 'none';
                btn.innerHTML = '<i class="fas fa-eye"></i><span>Показать подсказку</span>';
            }
        });

        // Mobile menu
        document.getElementById('menuBtn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        });
        document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

        // Mobile tabs
        document.getElementById('tabTheory').addEventListener('click', () => {
            mobileTab = 'theory';
            document.getElementById('tabTheory').classList.add('active');
            document.getElementById('tabCode').classList.remove('active');
            document.getElementById('theoryPanel').classList.remove('hidden-mobile');
            document.getElementById('codePanel').classList.add('hidden-mobile');
        });
        document.getElementById('tabCode').addEventListener('click', () => {
            mobileTab = 'code';
            document.getElementById('tabCode').classList.add('active');
            document.getElementById('tabTheory').classList.remove('active');
            document.getElementById('codePanel').classList.remove('hidden-mobile');
            document.getElementById('theoryPanel').classList.add('hidden-mobile');
        });

        // Initial mobile state
        if (window.innerWidth <= 768) {
            document.getElementById('codePanel').classList.add('hidden-mobile');
        }
    });
    </script>
</body>
</html>
